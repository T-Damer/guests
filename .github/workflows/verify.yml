name: Verify GUESTS

on:
  push:
    branches: [main, stable, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source under test
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          git archive --format=zip --output=artifacts/source.zip HEAD
      - name: Install pinned toolchain
        run: python3 tools/dev.py setup
      - name: Import, structural checks, domain and two-process ENet tests
        run: python3 tools/dev.py check
      - name: Install software rendering dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Render visual fixtures (not an FPS benchmark or art approval)
        run: xvfb-run -a python3 tools/dev.py capture
      - name: Export and launch Linux client
        run: python3 tools/dev.py export ${{ github.ref_name == 'stable' && '--release' || '' }}
      - name: Retain source, logs, captures and build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guests-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/
            build/
          retention-days: 14
          if-no-files-found: error
